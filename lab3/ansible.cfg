# =====================================================================
# Ansible konfiguratsioonifail - Lab 3 (Gert-Daniel Ilm)
# Asukoht: /etc/ansible/ansible.cfg
# =====================================================================
[defaults]
# inventory fail, kus on kirjas hallatavad kliendiserverid (grupp webservers)
inventory = /etc/ansible/hosts
# uue kliendi SSH võtme automaatne aktsepteerimine (ei küsi yes/no)
host_key_checking = False
# kliendiserveritesse logitakse sisse root kasutajana (SSH võtmega, ilma paroolita)
remote_user = root
